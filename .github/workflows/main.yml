name: YakuzV5

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Auto re-trigger periodically (keeps the job cycling within GitHub's limits)
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours

jobs:
  bot:
    runs-on: ubuntu-latest
    # GitHub free runners max ~6 hours per job
    timeout-minutes: 360
    steps:
      - name: Checkout Bot
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Force git to use HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: |
          npm install --omit=dev
          # optional: rebuild native deps if needed
          # npm rebuild

      - name: Start Bot (auto restart forever)
        env:
          # Secrets → repo → Settings → Secrets and variables → Actions
          # Only these two are actually read by config.js — add more here
          # only after wiring them into config.js / index.js first.
          SESSION_ID: ${{ secrets.SESSION_ID }}
          MONGODB: ${{ secrets.MONGODB }}
        run: |
          echo "================================="
          echo " YakuzV5 — Auto Restart"
          echo "================================="
          RESTART_COUNT=0
          while true; do
            RESTART_COUNT=$((RESTART_COUNT + 1))
            echo ""
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Start #$RESTART_COUNT"
            echo "---------------------------------"
            # Run bot — if crash/exit, loop continues
            node index.js
            EXIT_CODE=$?
            echo "---------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Bot stopped | Exit: $EXIT_CODE"
            # Exit codes you may want to STOP restarting (optional)
            # 42 = manual stop signal you define in code
            if [ "$EXIT_CODE" -eq 42 ]; then
              echo "Manual stop requested (exit 42). Exiting workflow."
              exit 0
            fi
            # Fast crash protection — if dies under 15s, wait longer
            echo "Restarting in 10 seconds..."
            sleep 10
          done
